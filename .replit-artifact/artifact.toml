kind = "web"
previewPath = "/"
title = "Kanji Reference Exporter"
version = "1.0.0"
id = "artifacts/kanji-toolkit"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22981

[services.development]
run = "pnpm --filter @workspace/kanji-toolkit run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kanji-toolkit", "run", "build" ]
serve = "static"
publicDir = "artifacts/kanji-toolkit/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22981"
BASE_PATH = "/"
